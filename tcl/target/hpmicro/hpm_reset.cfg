# Boot ROM may briefly disable debug and discard HALTREQ after reset.
# Keep these target files usable with OpenOCD versions before the retry option.
set _HPM_RESET_HALT_RETRY 1
if {[catch {$_TARGET0 riscv reset_halt_retry on}]} {
	set _HPM_RESET_HALT_RETRY 0
}

# Keep NDMRESET asserted long enough for the HPM reset controller to sample it.
$_TARGET0 configure -event reset-deassert-pre {
	sleep 1
	# Retain the old one-shot halt when retry is absent or explicitly disabled.
	if {$halt && (!$::_HPM_RESET_HALT_RETRY ||
			[$::_TARGET0 riscv reset_halt_retry] eq "off")} {
		$::_TARGET0 arp_halt
	}
}
