namespace import testing_helpers::*

adapter driver dummy
jtag newtap tap cpu -irlen 5
target create cpu0 riscv -tap tap.cpu -coreid 0
target create cpu1 riscv -tap tap.cpu -coreid 1

check_matches {^off$} {cpu0 riscv reset_halt_retry}
check_matches {^off$} {cpu1 riscv reset_halt_retry}
cpu0 riscv reset_halt_retry on
check_matches {^on$} {cpu0 riscv reset_halt_retry}
check_matches {^off$} {cpu1 riscv reset_halt_retry}
cpu1 riscv reset_halt_retry on
cpu0 riscv reset_halt_retry off
check_matches {^off$} {cpu0 riscv reset_halt_retry}
check_matches {^on$} {cpu1 riscv reset_halt_retry}
check_syntax_err {cpu0 riscv reset_halt_retry invalid}
check_syntax_err {cpu0 riscv reset_halt_retry on off}

shutdown
