namespace import testing_helpers::*
adapter driver dummy
jtag newtap tap cpu -irlen 5
target create cpu0 riscv -tap tap.cpu -coreid 0
target create cpu1 riscv -tap tap.cpu -coreid 1

check_matches {^off$} {cpu0 riscv progbuf_read_multiword}
check_matches {^off$} {cpu1 riscv progbuf_read_multiword}
cpu0 riscv progbuf_read_multiword on
check_matches {^on$} {cpu0 riscv progbuf_read_multiword}
check_matches {^off$} {cpu1 riscv progbuf_read_multiword}
cpu1 riscv progbuf_read_multiword on
cpu0 riscv progbuf_read_multiword off
check_matches {^off$} {cpu0 riscv progbuf_read_multiword}
check_matches {^on$} {cpu1 riscv progbuf_read_multiword}

check_matches {^off$} {cpu0 riscv progbuf_write_multiword}
check_matches {^off$} {cpu1 riscv progbuf_write_multiword}
cpu0 riscv progbuf_write_multiword on
check_matches {^on$} {cpu0 riscv progbuf_write_multiword}
check_matches {^off$} {cpu1 riscv progbuf_write_multiword}
cpu1 riscv progbuf_write_multiword on
cpu0 riscv progbuf_write_multiword off
check_matches {^off$} {cpu0 riscv progbuf_write_multiword}
check_matches {^on$} {cpu1 riscv progbuf_write_multiword}
check_matches {^off$} {cpu0 riscv progbuf_read_multiword}
check_matches {^on$} {cpu1 riscv progbuf_read_multiword}

shutdown
