namespace import testing_helpers::*

adapter driver hpm_probex
check_matches {^sequence_queue: on$} {hpm_probex sequence_queue}
hpm_probex sequence_queue off
check_matches {^sequence_queue: off$} {hpm_probex sequence_queue}
hpm_probex sequence_queue on
check_matches {^sequence_queue: on$} {hpm_probex sequence_queue}
check_syntax_err {hpm_probex sequence_queue invalid}
check_syntax_err {hpm_probex sequence_queue on off}

shutdown
