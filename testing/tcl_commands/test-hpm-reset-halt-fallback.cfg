# Simulate both OpenOCD versions that lack the command and targets whose
# runtime setting is changed after loading the HPM configuration.
set _TARGET0 hpm_reset_test_target
proc hpm_reset_test_target {args} {
	if {[lindex $args 0] eq "riscv"} {
		if {!$::modern} {
			error "unknown command"
		}
		if {[llength $args] == 3} {
			set ::retry [lindex $args 2]
		}
		return $::retry
	}
	if {[lindex $args 0] eq "configure"} {
		set ::reset_event [lindex $args 3]
		return
	}
	if {[lindex $args 0] eq "arp_halt"} {
		incr ::halt_count
		return
	}
	error "unexpected target command: $args"
}

set config [file join [file dirname [info script]] .. .. tcl target hpmicro hpm_reset.cfg]
foreach modern {0 1} {
	set retry off
	source $config
	foreach setting {off on} {
		if {$modern} {
			set retry $setting
		}
		foreach halt {0 1} {
			set halt_count 0
			eval $reset_event
			set expected [expr {$halt && (!$modern || $setting eq "off")}]
			if {$halt_count != $expected} {
				error "wrong reset halt fallback: modern=$modern retry=$setting halt=$halt"
			}
		}
	}
}

shutdown
